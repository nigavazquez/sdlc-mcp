# Stack local: Postgres + server (imagen buildeada del repo).
#
#   docker compose -f infra/compose.yml up -d postgres      # sólo la base, para `pnpm dev`
#
# Instancia local real (con su propio env, base y volumen):
#
#   cp infra/env.local.example infra/.env.local             # completar
#   docker compose --env-file infra/.env.local -f infra/compose.yml build
#   docker compose --env-file infra/.env.local -f infra/compose.yml --profile migrate run --rm migrate
#   docker compose --env-file infra/.env.local -f infra/compose.yml up -d
#
# `--env-file` alimenta la interpolación de este archivo (puertos, nombre del proyecto) y
# `env_file` lo pasa al contenedor (secretos SECRET_*, OIDC, panel). COMPOSE_PROJECT_NAME
# en ese archivo separa contenedores, red y volumen de los de otra instancia.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdlc
      POSTGRES_PASSWORD: sdlc
      POSTGRES_DB: sdlc
    ports:
      - "${SDLC_PG_BIND:-5432}:5432"
    volumes:
      - sdlc-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdlc -d sdlc"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Corre las migraciones y sale. Misma imagen que el server.
  migrate:
    image: sdlc-mcp:local
    profiles: ["migrate"]
    restart: "no"
    command: ["node", "dist/state/migrate-cli.js"]
    environment:
      DATABASE_URL: "postgresql://sdlc:sdlc@postgres:5432/sdlc"
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: sdlc-mcp:local
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
    env_file:
      - path: ./.env.local
        required: false
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRETS_BACKEND: env
      # Google SSO: completar con el client OAuth (ver docs/runbook-google-sso.md)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_SIGNING_SECRET: ${OAUTH_SIGNING_SECRET:-dev-only-signing-secret}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATABASE_URL: "postgresql://sdlc:sdlc@postgres:5432/sdlc"
      SDLC_CONFIG: /app/sdlc.config.yaml
      # Diagramas mermaid como imagen en Drive. Vacío = los diagramas quedan como código.
      DIAGRAMS_URL: ${DIAGRAMS_URL-http://diagrams:3100}
    volumes:
      # Estructura de la organización. Sin SDLC_CONFIG_FILE monta el ejemplo.
      - ${SDLC_CONFIG_FILE:-../sdlc.config.example.yaml}:/app/sdlc.config.yaml:ro
    ports:
      - "${SDLC_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # mermaid → PNG para los documentos de Drive (historia #55). Imagen aparte porque Chromium
  # pesa ~1,7 GB. Sin puertos publicados: sólo lo ve el server. Si no corre, el server
  # publica los diagramas como código.
  diagrams:
    image: sdlc-diagrams:local
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.diagrams
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  sdlc-pg-data:
