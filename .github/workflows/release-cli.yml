name: Release CLI

# Publica @nigav/sdlc en npm al pushear un tag cli-v<versión> (RFC sdlc-repo-onboarding, #16).
# Con provenance: el paquete queda atado a este workflow y a este commit.
on:
  push:
    tags: ['cli-v*']

permissions:
  contents: read
  id-token: write # provenance de npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Falla sin publicar si no está el secreto de npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Falta el secreto NPM_TOKEN: no se publica nada."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.12.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile=false
      - name: El tag tiene que coincidir con la versión del paquete
        run: |
          expected="cli-v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión del paquete ($expected)."
            exit 1
          fi
      - run: pnpm --filter @nigav/sdlc build
      - run: pnpm --filter @nigav/sdlc test
      - name: Publicar
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
