  - { id: onboarding, name: Onboarding, group: fintech }
  - { id: home, name: Home, group: fintech }
  - { id: transferencias, name: Transferencias, group: fintech }
  - { id: account, name: Account, group: fintech }
  - { id: settings, name: Settings, group: fintech }
