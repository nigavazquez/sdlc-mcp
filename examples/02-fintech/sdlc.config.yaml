# Las membresías no van acá: las carga setup.sh desde personas.json.
tenantId: default

labels:
  workspace: { singular: squad, plural: squads }
  group: { singular: tribu, plural: tribus }

adminEmails:
  - vazquez.n.g@gmail.com

groups:
  - { id: fintech, name: Fintech }

workspaces:
